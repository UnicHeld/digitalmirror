[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalmirror"
version = "0.1.0"
description = "Observador passivo local de presença digital — contratos e spike M0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[project.scripts]
digitalmirror = "digitalmirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
